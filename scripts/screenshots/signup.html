<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fieldnote · Create your account</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1f2430; background: #f4f5f7; display: grid; grid-template-columns: 1fr 1fr; }
    .hero { background: #14213d; color: #f4f5f7; padding: 72px 64px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { font-weight: 600; font-size: 20px; letter-spacing: 0.2px; }
    .brand span { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #fca311; margin-right: 10px; }
    .hero h1 { font-size: 40px; line-height: 1.15; margin: 0 0 16px; font-weight: 600; }
    .hero p { margin: 0; color: #c7ccd8; font-size: 18px; max-width: 420px; }
    .foot { color: #8b93a7; font-size: 14px; }
    .form-side { display: flex; align-items: center; justify-content: center; padding: 48px; }
    form { width: 380px; background: #fff; border-radius: 14px; padding: 36px; box-shadow: 0 1px 2px rgba(20,33,61,.06), 0 8px 24px rgba(20,33,61,.08); }
    h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
    .sub { margin: 0 0 24px; color: #6b7280; font-size: 15px; }
    label { display: block; font-size: 14px; font-weight: 500; margin: 14px 0 6px; }
    input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #d5d9e0; border-radius: 8px; font: inherit; color: inherit; }
    input:focus { outline: 2px solid #fca311; outline-offset: -1px; border-color: transparent; }
    button { width: 100%; height: 44px; margin-top: 24px; border: 0; border-radius: 8px; background: #14213d; color: #fff; font: inherit; font-weight: 600; }
    .terms { margin: 14px 0 0; font-size: 13px; color: #8b93a7; text-align: center; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="brand"><span></span>Fieldnote</div>
    <div>
      <h1>Notes your whole team can actually find.</h1>
      <p>Write, link, and search everything in one place. Free for teams up to five.</p>
    </div>
    <div class="foot">Fieldnote is a made-up product for this screenshot.</div>
  </section>
  <section class="form-side">
    <form onsubmit="return false">
      <h2>Create your account</h2>
      <p class="sub">Start your 14-day free trial.</p>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password">
      <button type="submit">Create account</button>
      <p class="terms">By signing up you agree to the terms.</p>
    </form>
  </section>
</body>
</html>
