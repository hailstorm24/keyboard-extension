<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shortcuts</title>
  <script src="/recorder.js"></script>
  <style>#palette[hidden] { display: none; }</style>
</head>
<body>
  <h1>App with its own shortcuts</h1>
  <p>⌘K / Ctrl+K opens the palette. Esc closes it. "?" counts help opens.</p>
  <div id="palette" hidden><input id="palette-input" placeholder="Search commands"></div>
  <label>Editor <input id="editor"></label>
  <script src="/shortcuts.js"></script>
</body>
</html>
